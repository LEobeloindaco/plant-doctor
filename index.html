<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        /**
         * Bridge File per Plant Doctor
         * Riceve i dati dal modello e istruisce l'app ad aprire la WebView "Widget" in chat.
         */
        window['ai_edge_gallery_get_result'] = async (data) => {
            try {
                return JSON.stringify({
                    result: data, 
                    webview: {
                        url: "webview.html?res=" + encodeURIComponent(data),
                        aspectRatio: 1.5 
                    }
                });
            } catch (e) {
                return JSON.stringify({ error: e.message });
            }
        };
    </script>
</body>
</html>
