<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Doctor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-emerald-100 min-h-screen p-4">

    <div class="max-w-xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden">
        <div class="bg-green-600 p-6 text-white flex items-center gap-3">
            <i data-lucide="leaf" class="w-8 h-8"></i>
            <div>
                <h1 class="text-2xl font-bold">Plant Doctor</h1>
                <p class="text-xs opacity-90">Gemma 4 Vision</p>
            </div>
        </div>

        <div class="p-6" id="content">
            <div class="text-center py-12">
                <div class="w-20 h-20 mx-auto mb-4 border-4 border-green-200 border-t-green-600 rounded-full animate-spin"></div>
                <p class="text-green-800 font-medium">Caricamento interfaccia...</p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // FUNZIONE OBBLIGATORIA che Edge Gallery chiama automaticamente
        window.ai_edge_gallery_get_result = async (rawData) => {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="text-center py-12">
                    <div class="w-20 h-20 mx-auto mb-4 border-4 border-green-200 border-t-green-600 rounded-full animate-spin"></div>
                    <p class="text-green-800 font-medium">Analisi della pianta in corso...</p>
                </div>`;

            try {
                const data = JSON.parse(rawData);
                const imageUrl = data.image_url || data.image || data.images?.[0];

                if (!imageUrl) throw new Error("Nessuna immagine ricevuta");

                // Converti image_url → base64 (necessario per Ollama)
                const base64 = await urlToBase64(imageUrl);

                const prompt = `Sei Plant Doctor, esperto botanico. Analizza SOLO con questo JSON esatto:

{
  "health_score": numero 0-100,
  "urgency": "bassa"|"media"|"alta",
  "diagnosis": "diagnosi chiara in italiano",
  "tips": ["consiglio 1", "consiglio 2", "consiglio 3"]
}`;

                const res = await fetch("http://localhost:11434/api/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "gemma-4-e2b-it",
                        prompt: prompt,
                        images: [base64],
                        stream: false,
                        format: "json"
                    })
                });

                const ollama = await res.json();
                const result = JSON.parse(ollama.response.trim());

                renderResults(result);

                return JSON.stringify({ success: true, health_score: result.health_score });

            } catch (e) {
                console.error(e);
                content.innerHTML = `
                    <div class="p-8 text-center text-red-600">
                        <p class="font-bold text-xl">Errore</p>
                        <p class="text-sm mt-2">${e.message}</p>
                        <p class="text-xs mt-4">Controlla che Ollama sia attivo su localhost:11434</p>
                    </div>`;
                return JSON.stringify({ error: e.message });
            }
        };

        async function urlToBase64(url) {
            const resp = await fetch(url);
            const blob = await resp.blob();
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(blob);
            });
        }

        function renderResults(data) {
            const html = `
                <div class="space-y-6">
                    <div class="flex gap-4">
                        <div class="flex-1 bg-gray-50 rounded-2xl p-6 text-center">
                            <p class="text-xs uppercase text-gray-500">Salute</p>
                            <p class="text-6xl font-black text-green-600">${data.health_score || 70}</p>
                        </div>
                        <div id="urgency-badge" class="flex-1 rounded-2xl p-6 border text-center">
                            <p class="text-xs uppercase text-gray-500">Urgenza</p>
                            <p class="text-3xl font-bold">${(data.urgency || 'media').toUpperCase()}</p>
                        </div>
                    </div>

                    <div class="bg-green-50 p-6 rounded-2xl">
                        <h3 class="font-bold flex items-center gap-2 mb-3"><i data-lucide="microscope" class="w-5 h-5"></i>Diagnosi</h3>
                        <p class="text-gray-700">${data.diagnosis}</p>
                    </div>

                    <div>
                        <h3 class="font-bold mb-3">Piano di cura</h3>
                        <ul id="tips-list" class="space-y-3"></ul>
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = html;

            const tipsList = document.getElementById('tips-list');
            (data.tips || []).forEach(tip => {
                const li = document.createElement('li');
                li.className = "flex items-start gap-3 bg-white p-4 rounded-2xl shadow-sm";
                li.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5 text-green-500 mt-0.5"></i><span class="text-gray-700">${tip}</span>`;
                tipsList.appendChild(li);
            });

            lucide.createIcons();

            // Colore urgenza
            const badge = document.getElementById('urgency-badge');
            const u = (data.urgency || 'media').toLowerCase();
            badge.className = `flex-1 rounded-2xl p-6 border text-center ${u === 'alta' ? 'bg-red-100 border-red-300 text-red-700' : u === 'media' ? 'bg-yellow-100 border-yellow-300 text-yellow-700' : 'bg-green-100 border-green-300 text-green-700'}`;
        }

        // Fallback se non arriva l'immagine
        window.addEventListener('load', () => {
            if (!document.getElementById('content').innerHTML.includes('Analisi')) {
                document.getElementById('content').innerHTML = `
                    <div class="text-center py-12">
                        <p class="text-2xl font-bold text-green-700">🌱 Plant Doctor pronto</p>
                        <p class="text-gray-500 mt-2">Invia una foto della pianta per iniziare</p>
                    </div>`;
            }
        });
    </script>
</body>
</html>
