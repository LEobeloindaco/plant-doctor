<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        /**
         * Questo è il file "Bridge" (Testa di ponte).
         * Riceve i dati dal modello Gemma e istruisce l'app ad aprire la WebView.
         */
        window['ai_edge_gallery_get_result'] = async (data) => {
            try {
                // Restituiamo un JSON che indica all'app di caricare la nostra WebView personalizzata
                // Passiamo il risultato di Gemma come parametro nell'URL
                return JSON.stringify({
                    result: data, // Testo visualizzato se la webview fallisce
                    webview: {
                        url: "webview.html?res=" + encodeURIComponent(data),
                        aspectRatio: 1.2 // Rapporto d'aspetto della finestra in chat
                    }
                });
            } catch (e) {
                return JSON.stringify({ error: e.message });
            }
        };
    </script>
</body>
</html>
