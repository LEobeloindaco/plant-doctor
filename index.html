<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathfinder - Gemma 4 Survival Skill</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121813;
            --surface: rgba(28, 40, 30, 0.7);
            --surface-border: rgba(80, 110, 85, 0.3);
            --primary: #d96c06; /* Rescue Orange */
            --primary-hover: #ff8b20;
            --text-main: #e8ede9;
            --text-muted: #8a9c8f;
            --accent: #5e8a64;
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(94, 138, 100, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(217, 108, 6, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            /* Topographic map pattern simulation using repeating radial gradients */
            background-size: 100px 100px;
            overflow-x: hidden;
        }

        /* Topo map SVG background overlay */
        .topo-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.05;
            z-index: -1;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%235e8a64' fill-opacity='1' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        header {
            width: 100%;
            padding: 3rem 1rem 1.5rem;
            text-align: center;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: var(--primary);
            border-radius: 16px;
            margin-bottom: 1rem;
            box-shadow: 0 0 20px rgba(217, 108, 6, 0.4);
            transform: rotate(45deg);
        }

        .logo-container svg {
            transform: rotate(-45deg);
            width: 32px;
            height: 32px;
            fill: #fff;
        }

        h1 {
            margin: 0;
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p.subtitle {
            margin: 0.5rem 0 0 0;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9rem;
            color: var(--primary);
            letter-spacing: 1px;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 650px;
            padding: 1rem 1.5rem 3rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 1;
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 1.8rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(217, 108, 6, 0.3);
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 0.8rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            scrollbar-width: none; /* Firefox */
        }
        .quick-actions::-webkit-scrollbar { display: none; }

        .chip {
            background: rgba(94, 138, 100, 0.15);
            border: 1px solid rgba(94, 138, 100, 0.3);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chip:hover, .chip:active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            transform: translateY(-2px);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        label {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            background: rgba(10, 15, 12, 0.6);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 1.2rem;
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            color: var(--text-main);
            resize: vertical;
            min-height: 120px;
            box-sizing: border-box;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(217, 108, 6, 0.2);
        }

        textarea::placeholder {
            color: rgba(138, 156, 143, 0.5);
        }

        button.btn-primary {
            background: var(--primary);
            color: #121813;
            border: none;
            border-radius: 16px;
            padding: 1.2rem 2rem;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            width: 100%;
        }

        button.btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(217, 108, 6, 0.4);
        }
        
        button.btn-primary:active {
            transform: translateY(0);
        }

        /* Compass Radar Loading */
        #loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .compass-loader {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--surface-border);
            margin: 0 auto 1.5rem;
            background: rgba(10, 15, 12, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .compass-loader::before {
            content: '';
            position: absolute;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(217, 108, 6, 0.4));
            transform-origin: left center;
            animation: radar 2s linear infinite;
            left: 50%;
        }
        
        .compass-loader::after {
            content: 'N';
            position: absolute;
            top: 5px;
            font-family: 'Roboto Mono', monospace;
            font-size: 10px;
            color: var(--primary);
            font-weight: bold;
        }

        .compass-needle {
            width: 0; 
            height: 0; 
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 30px solid var(--primary);
            position: relative;
            z-index: 2;
            animation: needleWobble 3s ease-in-out infinite;
            transform-origin: bottom center;
            margin-bottom: 30px;
        }
        
        .compass-needle::after {
            content: '';
            position: absolute;
            width: 0; 
            height: 0; 
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 30px solid #e8ede9;
            top: 30px;
            left: -6px;
        }

        @keyframes radar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes needleWobble {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(8deg); }
        }

        .loading-text {
            font-family: 'Roboto Mono', monospace;
            color: var(--primary);
            font-size: 0.9rem;
            letter-spacing: 2px;
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        #result-container {
            display: none;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Markdown Styling for Dark Theme */
        .markdown-content {
            line-height: 1.7;
            font-size: 1.05rem;
        }

        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            color: #fff;
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
        }
        
        .markdown-content h3 {
            color: var(--primary);
            font-size: 1.2rem;
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 0.5rem;
        }

        .markdown-content p {
            margin-bottom: 1.2rem;
        }

        .markdown-content strong {
            color: #fff;
            font-weight: 600;
        }

        .markdown-content ul, .markdown-content ol {
            padding-left: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .markdown-content li {
            margin-bottom: 0.5rem;
        }
        
        .markdown-content li::marker {
            color: var(--primary);
        }

        .action-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="topo-bg"></div>

    <header>
        <div class="logo-container">
            <!-- Mountain/Compass Icon -->
            <svg viewBox="0 0 24 24">
                <path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13.5H5.5L12 6.5zM12 10l-3 7h6l-3-7z"/>
            </svg>
        </div>
        <h1>Pathfinder</h1>
        <p class="subtitle">SYS.NAV // GEMMA_4_E4B</p>
    </header>

    <main>
        <!-- User Input Section -->
        <div class="card">
            
            <div class="quick-actions">
                <div class="chip" onclick="fillPrompt('Mi sono perso in un bosco senza bussola e si sta facendo buio. Cosa faccio per passare la notte al sicuro?')">
                    <span>🧭</span> Mi sono perso
                </div>
                <div class="chip" onclick="fillPrompt('Vado a fare un trekking di 2 giorni in montagna (estate). Fammi la lista dell\'equipaggiamento essenziale.')">
                    <span>🎒</span> Zaino Perfetto
                </div>
                <div class="chip" onclick="fillPrompt('Come faccio a capire se pioverà guardando la natura e le nuvole?')">
                    <span>☁️</span> Previsioni Meteo
                </div>
                <div class="chip" onclick="fillPrompt('Qual è il nodo migliore per legare una corda a un albero per creare un riparo?')">
                    <span>🪢</span> Nodi essenziali
                </div>
            </div>

            <div class="input-group">
                <label for="situation-input">LOG SITUAZIONE</label>
                <textarea id="situation-input" placeholder="Descrivi l'ambiente, il problema o cosa vuoi imparare..."></textarea>
                
                <button class="btn-primary" onclick="requestAnalysis()">
                    <svg class="action-icon" viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                    Avvia Analisi
                </button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="card">
            <div class="compass-loader">
                <div class="compass-needle"></div>
            </div>
            <div class="loading-text">ANALISI DATI AMBIENTALI...</div>
        </div>

        <!-- Result Section -->
        <div id="result-container" class="card">
            <div class="markdown-content" id="result-content">
                <!-- Result will be injected here -->
            </div>
        </div>
    </main>

    <script>
        function fillPrompt(text) {
            const textarea = document.getElementById('situation-input');
            textarea.value = text;
            textarea.focus();
        }

        function requestAnalysis() {
            const situation = document.getElementById('situation-input').value;
            if (!situation.trim()) {
                // Shake animation for empty input could be added here
                alert("Compila il log della situazione prima di procedere.");
                return;
            }

            // Hide UI elements to show loading
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            // Native layer call (AI Edge Gallery logic)
            if (window.AndroidInterface && window.AndroidInterface.processPrompt) {
                // The prompt combines the user input with the implicit Skill request
                const prompt = `L'utente descrive questa situazione/richiesta: "${situation}". 
                Rispondi applicando le linee guida del tuo ruolo di Pathfinder (Valutazione, Piano d'Azione, Rischi, Consiglio).`;
                
                window.AndroidInterface.processPrompt(prompt);
            } else {
                // Simulation for development
                setTimeout(() => {
                    ai_edge_gallery_get_result("🧭 **Valutazione Iniziale:** Situazione potenzialmente pericolosa a causa del buio imminente. La priorità è fermarsi e allestire un bivacco di emergenza.\n\n### 🗺️ Piano d'Azione (Bivacco Improvvisato):\n1. **Fermati (S.T.O.P.):** Smetti di camminare. Cercare la strada al buio aumenta drasticamente il rischio di infortuni.\n2. **Trova un riparo naturale:** Cerca la base di un grosso albero, un ceppo scavato, o rocce sporgenti che ti proteggano dal vento.\n3. **Isolati dal terreno:** È la regola d'oro. Ammucchia foglie secche, rami di pino o erba per creare un materasso spesso almeno 15 cm. Il terreno freddo sottrae calore al corpo molto più dell'aria.\n4. **Conservazione calore:** Indossa tutti i vestiti che hai a strati. Mettiti in posizione fetale per minimizzare la dispersione di calore.\n\n### ⚠️ Fattori di Rischio:\n*   **NON muoverti di notte:** Rischio altissimo di cadute in dirupi o ferite agli occhi con rami.\n*   **NON accendere un fuoco** se non hai una fonte di luce adeguata per raccogliere la legna in sicurezza e pulire l'area (rischio incendio boschivo).\n\n### 🎒 Il Consiglio dell'Esploratore:\n> Il panico è il tuo peggior nemico, non il bosco. Respira profondamente, accetta la situazione e preparati ad un po' di scomodità. All'alba la prospettiva cambierà completamente e la visibilità tornerà.");
                }, 2500);
            }
        }

        // Global function called by the Native Android App (Gemma 4 inference result)
        window.ai_edge_gallery_get_result = function(resultText) {
            document.getElementById('loading').style.display = 'none';
            
            const resultContainer = document.getElementById('result-container');
            const resultContent = document.getElementById('result-content');
            
            // Simple Markdown Parsing for the custom dark theme
            let formattedText = resultText
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/### (.*?)(<br>|<\/p>)/g, '<h3>$1</h3>$2')
                .replace(/> (.*?)(<br>|<\/p>)/g, '<blockquote style="border-left: 4px solid var(--primary); padding-left: 1rem; margin-left: 0; color: var(--text-muted); font-style: italic;">$1</blockquote>$2');
            
            // Handle lists (basic implementation)
            formattedText = formattedText.replace(/(\d+\.) (.*?)(<br>|<\/p>)/g, '<li style="list-style-type: decimal; margin-left: 1.5rem;"><strong>$1</strong> $2</li>$3');
            formattedText = formattedText.replace(/(\*) (.*?)(<br>|<\/p>)/g, '<li style="list-style-type: disc; margin-left: 1.5rem;">$2</li>$3');
            
            resultContent.innerHTML = `<p>${formattedText}</p>`;
            resultContainer.style.display = 'block';
            
            // Scroll to result smoothly
            resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        };
        
        window.ai_edge_gallery_on_error = function(errorMessage) {
            document.getElementById('loading').style.display = 'none';
            const resultContent = document.getElementById('result-content');
            resultContent.innerHTML = `<p style="color: #ff4d4d; border: 1px solid #ff4d4d; padding: 1rem; border-radius: 12px; background: rgba(255, 77, 77, 0.1);"><strong>SYS_ERROR:</strong> ${errorMessage}</p>`;
            document.getElementById('result-container').style.display = 'block';
        };
    </script>
</body>
</html>
