<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Doctor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-green-50 to-emerald-100 min-h-screen p-4">

    <div class="max-w-xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden">
        <div class="bg-green-600 p-6 text-white flex items-center gap-3">
            <i data-lucide="leaf" class="w-8 h-8"></i>
            <div>
                <h1 class="text-2xl font-bold">🌱 Plant Doctor</h1>
                <p class="text-xs">Gemma 4 Vision</p>
            </div>
        </div>

        <div class="p-6" id="content">
            <div class="text-center py-12">
                <p class="text-xl font-bold text-green-700">Pronto per l'analisi</p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Funzione principale chiamata da Edge Gallery
        window.ai_edge_gallery_get_result = async (rawData) => {
            const content = document.getElementById('content');

            try {
                const data = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
                const imageUrl = data.image_url;
                const analysis = data.analysis;

                if (analysis) {
                    // Se Gemma ha già fatto l'analisi, mostriamo i risultati direttamente
                    showResults(imageUrl, analysis);
                } else if (imageUrl) {
                    // Fallback se abbiamo solo l'immagine
                    content.innerHTML = `
                        <div class="space-y-6">
                            <img src="${imageUrl}" class="w-full rounded-3xl shadow-md" alt="Pianta">
                            <div class="p-6 bg-yellow-50 rounded-2xl text-center text-yellow-800">
                                <p>In attesa dell'analisi da parte di Gemma...</p>
                            </div>
                        </div>`;
                }
            } catch (e) {
                content.innerHTML = `<div class="p-8 text-red-600 text-center">Errore caricamento dati: ${e.message}</div>`;
            }
        };

        function showResults(imageUrl, data) {
            const html = `
                <div class="space-y-6">
                    <img src="${imageUrl}" class="w-full rounded-3xl shadow-md mb-4" alt="Pianta">
                    <div class="flex gap-4">
                        <div class="flex-1 bg-gray-50 rounded-2xl p-6 text-center">
                            <p class="text-xs uppercase text-gray-500">Salute</p>
                            <p class="text-6xl font-black text-green-600">${data.health_score || 0}</p>
                        </div>
                        <div id="urgency-badge" class="flex-1 rounded-2xl p-6 border text-center ${getUrgencyClass(data.urgency)}">
                            <p class="text-xs uppercase text-gray-500">Urgenza</p>
                            <p class="text-3xl font-bold">${(data.urgency || "media").toUpperCase()}</p>
                        </div>
                    </div>
                    <div class="bg-green-50 p-6 rounded-2xl shadow-sm border border-green-100">
                        <h3 class="font-bold mb-2 flex items-center gap-2 text-green-800">
                            <i data-lucide="activity" class="w-5 h-5"></i> Diagnosi
                        </h3>
                        <p class="text-gray-700 leading-relaxed">${data.diagnosis}</p>
                    </div>
                    <div>
                        <h3 class="font-bold mb-3 flex items-center gap-2 text-gray-800">
                            <i data-lucide="clipboard-list" class="w-5 h-5"></i> Piano di cura
                        </h3>
                        <ul id="tips-list" class="space-y-3"></ul>
                    </div>
                </div>
            `;
            document.getElementById('content').innerHTML = html;

            const tipsList = document.getElementById('tips-list');
            (data.tips || []).forEach(t => {
                const li = document.createElement('li');
                li.className = "bg-white p-4 rounded-2xl flex gap-3 shadow-sm border border-gray-100";
                li.innerHTML = `<i data-lucide="check-circle" class="text-green-500 w-5 h-5"></i><span class="text-gray-700">${t}</span>`;
                tipsList.appendChild(li);
            });
            lucide.createIcons();
        }

        function getUrgencyClass(urgency) {
            switch(urgency?.toLowerCase()) {
                case 'alta': return 'bg-red-50 border-red-200 text-red-700';
                case 'media': return 'bg-orange-50 border-orange-200 text-orange-700';
                default: return 'bg-green-50 border-green-200 text-green-700';
            }
        }
    </script>
</body>

</html>
