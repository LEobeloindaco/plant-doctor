<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathfinder WebView</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121813;
            --surface: rgba(28, 40, 30, 0.95);
            --surface-border: rgba(80, 110, 85, 0.4);
            --primary: #d96c06;
            --text-main: #e8ede9;
            --text-muted: #8a9c8f;
            --risk-low: #5e8a64;
            --risk-med: #d9a406;
            --risk-high: #d93f06;
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 10px;
            background-color: transparent;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        /* --- WIDGETS HEADER --- */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 15px;
        }

        /* Compass Widget */
        .compass-widget {
            position: relative;
            width: 50px;
            height: 50px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .compass-dial {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 0.1s ease-out;
        }
        .compass-dial::before {
            content: 'N';
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: bold;
            color: var(--primary);
            font-family: 'Roboto Mono', monospace;
        }
        .compass-needle {
            width: 4px;
            height: 40px;
            background: linear-gradient(to bottom, var(--primary) 50%, #fff 50%);
            border-radius: 2px;
            position: relative;
            z-index: 2;
            transition: transform 0.1s ease-out;
        }

        /* Risk Indicator */
        .risk-widget {
            text-align: right;
            font-family: 'Roboto Mono', monospace;
        }
        .risk-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .risk-value {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 4px;
            padding: 2px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        /* --- MARKDOWN CONTENT --- */
        .markdown-content {
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .markdown-content h3 {
            color: #fff;
            margin: 1.5rem 0 1rem;
            font-size: 1.1rem;
            border-left: 3px solid var(--primary);
            padding-left: 10px;
        }
        .markdown-content p { margin-bottom: 1rem; }
        .markdown-content strong { color: var(--primary); }

        /* Interactive Checklist */
        .checklist {
            list-style: none;
            padding: 0;
            margin: 0 0 1.5rem 0;
        }
        .checklist-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .checklist-item:hover {
            background: rgba(255,255,255,0.06);
            border-color: var(--surface-border);
        }
        .checklist-item input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            margin-top: 2px;
            transition: all 0.2s;
        }
        .checklist-item input[type="checkbox"]:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }
        .checklist-item input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            color: #121813;
            font-weight: bold;
            font-size: 14px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .checklist-item span {
            transition: color 0.2s, text-decoration 0.2s;
        }
        .checklist-item input[type="checkbox"]:checked + span {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        blockquote {
            border-left: 3px solid var(--primary);
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-style: italic;
            background: rgba(217, 108, 6, 0.05);
            padding: 15px;
            border-radius: 0 12px 12px 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Dashboard Header: Compass and Risk Level -->
        <div class="dashboard-header">
            <div class="compass-widget" id="compass">
                <div class="compass-dial"></div>
                <div class="compass-needle" id="needle"></div>
            </div>
            <div class="risk-widget">
                <div class="risk-label">Livello di Rischio</div>
                <div class="risk-value" id="risk-badge" style="background: var(--surface-border); color: var(--text-main);">CALCOLO...</div>
            </div>
        </div>

        <div id="result-content" class="markdown-content">
            <p>Sincronizzazione dati satellitari in corso...</p>
        </div>
    </div>

    <script>
        // 1. RISK CALCULATION
        function calculateRiskLevel(text) {
            const t = text.toLowerCase();
            const criticalWords = ['emergenza', 'ferita', 'sangue', 'perso', 'aiuto', 'pericolo', 'notte', 'soccorso', 'ipotermia', 'orso', 'morso'];
            const medWords = ['attenzione', 'difficile', 'rischioso', 'pioggia', 'temporale', 'freddo', 'scivoloso'];
            
            let isCritical = criticalWords.some(word => t.includes(word));
            let isMed = medWords.some(word => t.includes(word));

            const badge = document.getElementById('risk-badge');
            if (isCritical) {
                badge.textContent = 'CRITICO';
                badge.style.background = 'var(--risk-high)';
                badge.style.color = '#fff';
            } else if (isMed) {
                badge.textContent = 'ATTENZIONE';
                badge.style.background = 'var(--risk-med)';
                badge.style.color = '#121813';
            } else {
                badge.textContent = 'NORMALE';
                badge.style.background = 'var(--risk-low)';
                badge.style.color = '#fff';
            }
        }

        // 2. MARKDOWN & CHECKLIST PARSER
        function formatMarkdown(text) {
            if (!text) return "Nessun dato ricevuto.";
            
            // Handle Paragraphs and Bold
            let html = text
                .replace(/\n\n/g, '</p><p>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/### (.*?)(<br>|\n|<\/p>)/g, '<h3>$1</h3>$2')
                .replace(/> (.*?)(<br>|\n|<\/p>)/g, '<blockquote>$1</blockquote>$2');

            // Handle Lists -> Transform into Interactive Checklists
            // Match lines starting with 1. or * or - 
            html = html.replace(/(?:^|\n)(?:\d+\.|\*|\-)\s+(.*?)(?=\n|$)/g, function(match, itemText) {
                return `<li class="checklist-item">
                            <input type="checkbox">
                            <span>${itemText.trim()}</span>
                        </li>`;
            });

            // Wrap consecutive <li> into a <ul> container
            html = html.replace(/(<li class="checklist-item">.*?<\/li>)+/g, function(match) {
                return `<ul class="checklist">${match}</ul>`;
            });
            
            // Clean up rogue newlines
            html = html.replace(/\n/g, '<br>');

            return html;
        }

        // 3. INTERACTIVE COMPASS LOGIC
        function initCompass() {
            const needle = document.getElementById('needle');
            
            // Richiedi i permessi per i sensori su iOS/Android se disponibili
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                window.addEventListener('deviceorientation', handleOrientation, true);
            } else {
                // Fallback: Animazione lenta finta se i sensori non sono disponibili
                simulateCompass();
            }

            function handleOrientation(event) {
                let compassHeading = event.webkitCompassHeading || Math.abs(event.alpha - 360);
                if (compassHeading) {
                    needle.style.transform = `rotate(${-compassHeading}deg)`;
                } else {
                    simulateCompass(); // Fallback se i dati sono null
                }
            }

            function simulateCompass() {
                let angle = 0;
                setInterval(() => {
                    angle += (Math.random() - 0.5) * 5; // Piccolo tremolio
                    needle.style.transform = `rotate(${angle}deg)`;
                }, 100);
            }
        }

        // INITIALIZATION
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return { res: params.get('res') };
        }

        window.onload = () => {
            initCompass();
            
            const params = getUrlParams();
            let rawText = params.res ? decodeURIComponent(params.res) : null;
            
            // Pulizia di stringhe residue di sistema se l'app fa echo del prompt
            if (rawText && rawText.includes("window.AndroidInterface.processPrompt")) {
                rawText = "Errore di parsing nell'app: Ricevuto comando JS invece della risposta del modello.";
            }

            if (rawText) {
                calculateRiskLevel(rawText);
                document.getElementById('result-content').innerHTML = `<p>${formatMarkdown(rawText)}</p>`;
            }
        };
    </script>
</body>
</html>
