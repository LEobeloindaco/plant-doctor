<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Doctor - Analisi Visiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0B130D;
            --surface: rgba(20, 35, 23, 0.7);
            --surface-border: rgba(74, 222, 128, 0.2);
            --primary: #4ade80;
            --primary-hover: #22c55e;
            --text-main: #ecfdf5;
            --text-muted: #86efac;
            --accent: #ef4444; /* Red for alerts/bounding boxes */
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(74, 222, 128, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(34, 197, 94, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Organic Background overlay */
        .organic-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.03;
            z-index: -1;
            background-image: radial-gradient(var(--primary) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        header {
            width: 100%;
            padding: 3rem 1rem 1.5rem;
            text-align: center;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: rgba(20, 35, 23, 0.9);
            border: 1px solid var(--primary);
            border-radius: 16px;
            margin-bottom: 1rem;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
            transform: rotate(45deg);
            transition: all 0.5s ease;
        }

        .logo-container:hover {
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.5);
            transform: rotate(45deg) scale(1.05);
        }

        .logo-container svg {
            transform: rotate(-45deg);
            width: 32px;
            height: 32px;
            fill: var(--primary);
        }

        h1 {
            margin: 0;
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, var(--primary), #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            margin: 0.5rem 0 0 0;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9rem;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .tabs {
            display: flex;
            width: 100%;
            max-width: 650px;
            margin: 0 auto 1.5rem;
            background: rgba(10, 20, 12, 0.8);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 1rem;
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab.active {
            background: rgba(74, 222, 128, 0.15);
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        .tab:not(.active):hover {
            background: rgba(74, 222, 128, 0.05);
            color: #fff;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 650px;
            padding: 0 1.5rem 3rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 1;
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 1.8rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(74, 222, 128, 0.4);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            background: rgba(5, 10, 6, 0.6);
            color: var(--primary);
            border: 2px dashed var(--surface-border);
            border-radius: 16px;
            padding: 2.5rem 1rem;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .file-upload-btn svg {
            width: 40px;
            height: 40px;
            fill: var(--primary);
            opacity: 0.8;
            transition: all 0.3s ease;
        }

        .file-upload-btn:hover {
            background: rgba(74, 222, 128, 0.05);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.1);
        }

        .file-upload-btn:hover svg {
            transform: scale(1.1);
            opacity: 1;
        }

        .image-container {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            display: none;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            border: 1px solid var(--surface-border);
            margin-bottom: 0.5rem;
        }

        img#uploaded-image {
            width: 100%;
            height: auto;
            display: block;
        }

        canvas#overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        button.btn-primary {
            background: var(--primary);
            color: #0B130D;
            border: none;
            border-radius: 16px;
            padding: 1.2rem 2rem;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none; /* Hidden initially */
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            width: 100%;
        }

        button.btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 222, 128, 0.3);
        }
        
        button.btn-primary:active {
            transform: translateY(0);
        }

        /* Loading */
        #loading {
            display: none;
            text-align: center;
            padding: 2.5rem;
        }

        .dna-loader {
            display: inline-flex;
            gap: 6px;
            margin-bottom: 1.5rem;
        }

        .dna-loader div {
            width: 6px;
            height: 30px;
            background: var(--primary);
            border-radius: 3px;
            animation: dna 1.2s ease-in-out infinite;
        }

        .dna-loader div:nth-child(1) { animation-delay: -1.2s; }
        .dna-loader div:nth-child(2) { animation-delay: -1.1s; }
        .dna-loader div:nth-child(3) { animation-delay: -1.0s; }
        .dna-loader div:nth-child(4) { animation-delay: -0.9s; }
        .dna-loader div:nth-child(5) { animation-delay: -0.8s; }

        @keyframes dna {
            0%, 100% { transform: scaleY(0.3); opacity: 0.3; }
            50% { transform: scaleY(1); opacity: 1; }
        }

        .loading-text {
            font-family: 'Roboto Mono', monospace;
            color: var(--primary);
            font-size: 0.9rem;
            letter-spacing: 2px;
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        #result-container {
            display: none;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Markdown Styling */
        .markdown-content {
            line-height: 1.7;
            font-size: 1.05rem;
        }

        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            color: #fff;
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
        }
        
        .markdown-content h3 {
            color: var(--primary);
            font-size: 1.2rem;
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 0.5rem;
        }

        .markdown-content p {
            margin-bottom: 1.2rem;
        }

        .markdown-content strong {
            color: #fff;
            font-weight: 600;
        }

        .markdown-content ul, .markdown-content ol {
            padding-left: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .markdown-content li {
            margin-bottom: 0.5rem;
        }
        
        .markdown-content li::marker {
            color: var(--primary);
        }

        .action-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="organic-bg"></div>

    <header>
        <div class="logo-container">
            <!-- Scan SVG Icon -->
            <svg viewBox="0 0 24 24">
                <path d="M4 4h4v2H6v2H4V4zm16 0h-4v2h2v2h2V4zM4 20h4v-2H6v-2H4v4zm16 0h-4v-2h2v-2h2v4zm-9-8c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm0-4c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm3 8H8v-1c0-1.33 2.67-2 4-2s4 .67 4 2v1z" />
            </svg>
        </div>
        <h1>Plant Doctor</h1>
        <p class="subtitle">SYS.VISION // GEMMA_4_E4B</p>
    </header>

    <div class="tabs">
        <a href="index.html" class="tab">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            Analisi Testuale
        </a>
        <a href="webview.html" class="tab active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            Analisi Visiva
        </a>
    </div>

    <main>
        <!-- User Input Section -->
        <div class="card">
            <div class="input-group">
                <label>INPUT VISIVO</label>
                
                <label class="file-upload-btn" for="image-upload" id="upload-label">
                    <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    CARICA FOTO DELLA PIANTA
                </label>
                <input type="file" id="image-upload" accept="image/*" onchange="previewImage(event)">

                <div class="image-container" id="image-container">
                    <img id="uploaded-image" alt="Pianta caricata">
                    <canvas id="overlay"></canvas>
                </div>

                <button class="btn-primary" id="analyze-btn" onclick="requestAnalysis()">
                    <svg class="action-icon" viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                    Scansione Visiva
                </button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="card">
            <div class="dna-loader">
                <div></div><div></div><div></div><div></div><div></div>
            </div>
            <div class="loading-text">SCANSIONE AREE CRITICHE...</div>
        </div>

        <!-- Result Section -->
        <div id="result-container" class="card">
            <div class="markdown-content" id="result-content">
                <!-- Result will be injected here -->
            </div>
        </div>
    </main>

    <script>
        // Preview the uploaded image
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('uploaded-image');
                    img.src = e.target.result;
                    
                    document.getElementById('image-container').style.display = 'block';
                    document.getElementById('analyze-btn').style.display = 'flex';
                    document.getElementById('upload-label').style.display = 'none';
                    
                    // Clear previous results and canvas
                    document.getElementById('result-container').style.display = 'none';
                    const canvas = document.getElementById('overlay');
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
                reader.readAsDataURL(file);
            }
        }

        function requestAnalysis() {
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            // Clear previous drawings
            const canvas = document.getElementById('overlay');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (window.AndroidInterface && window.AndroidInterface.processImagePrompt) {
                window.AndroidInterface.processImagePrompt("Analizza questa pianta e identifica le aree problematiche restituendo coordinate per cerchiarle.");
            } else {
                setTimeout(() => {
                    const mockResponse = {
                        text: "👁️ **Scansione Visiva Completata:** Le aree evidenziate mostrano segni inequivocabili di **clorosi marcata** e piccole lesioni circolari compatibili con un **attacco fungino precoce**.\n\n### 🔬 Diagnosi Probabile:\nInfezione fungina localizzata (es. *Cercospora* o *Septoria*) favorita da umidità eccessiva sulle foglie.\n\n### 💧 Piano d'Azione Correttivo:\n1. **Rimozione controllata:** Taglia alla base le foglie colpite per evitare la diffusione delle spore.\n2. **Trattamento:** Applica un fungicida sistemico o a base di rame.\n3. **Ambiente:** Migliora la circolazione dell'aria ed evita di bagnare le foglie durante le irrigazioni.\n\n### 💡 Il Consiglio del Botanico:\n> Le malattie fungine si diffondono velocemente in ambienti caldi e stagnanti. Isola la pianta dalle altre fino a completa guarigione.",
                        areas: [
                            { x: 0.35, y: 0.45, radius: 0.12 },
                            { x: 0.65, y: 0.70, radius: 0.08 }
                        ]
                    };
                    window.ai_edge_gallery_get_result(JSON.stringify(mockResponse));
                }, 2500);
            }
        }

        function drawCircles(areas) {
            const canvas = document.getElementById('overlay');
            const img = document.getElementById('uploaded-image');
            
            canvas.width = img.clientWidth;
            canvas.height = img.clientHeight;
            
            const ctx = canvas.getContext('2d');
            
            ctx.strokeStyle = '#ef4444'; // Red alert color
            ctx.lineWidth = 4;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 8;
            
            areas.forEach(area => {
                const x = area.x * canvas.width;
                const y = area.y * canvas.height;
                const radius = area.radius * Math.min(canvas.width, canvas.height);
                
                // Draw pulsating target circle style
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, 2 * Math.PI);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(x, y, radius + 10, 0, 2 * Math.PI);
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
                ctx.stroke();
                
                // Add fill
                ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
                ctx.fill();
                
                // Crosshair in center
                ctx.beginPath();
                ctx.moveTo(x - 5, y);
                ctx.lineTo(x + 5, y);
                ctx.moveTo(x, y - 5);
                ctx.lineTo(x, y + 5);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ef4444';
                ctx.stroke();
            });
        }

        window.ai_edge_gallery_get_result = function(resultString) {
            document.getElementById('loading').style.display = 'none';
            
            let resultData;
            let resultText = resultString;
            let areas = [];

            try {
                resultData = JSON.parse(resultString);
                if (resultData.text) resultText = resultData.text;
                if (resultData.areas) areas = resultData.areas;
            } catch (e) {
                console.log("Response is not JSON, treating as plain text");
            }

            const resultContainer = document.getElementById('result-container');
            const resultContent = document.getElementById('result-content');
            
            let formattedText = resultText
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/### (.*?)(<br>|<\/p>)/g, '<h3>$1</h3>$2')
                .replace(/> (.*?)(<br>|<\/p>)/g, '<blockquote style="border-left: 4px solid var(--primary); padding-left: 1rem; margin-left: 0; color: var(--text-muted); font-style: italic;">$1</blockquote>$2');
            
            formattedText = formattedText.replace(/(\d+\.) (.*?)(<br>|<\/p>)/g, '<li style="list-style-type: decimal; margin-left: 1.5rem;"><strong>$1</strong> $2</li>$3');
            formattedText = formattedText.replace(/(\*) (.*?)(<br>|<\/p>)/g, '<li style="list-style-type: disc; margin-left: 1.5rem;">$2</li>$3');
            
            resultContent.innerHTML = `<p>${formattedText}</p>`;
            resultContainer.style.display = 'block';
            
            resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            if (areas && areas.length > 0) {
                const img = document.getElementById('uploaded-image');
                if (img.complete) {
                    drawCircles(areas);
                } else {
                    img.onload = () => drawCircles(areas);
                }
            }
        };
        
        window.ai_edge_gallery_on_error = function(errorMessage) {
            document.getElementById('loading').style.display = 'none';
            const resultContent = document.getElementById('result-content');
            resultContent.innerHTML = `<p style="color: #ff4d4d; border: 1px solid #ff4d4d; padding: 1rem; border-radius: 12px; background: rgba(255, 77, 77, 0.1);"><strong>SYS_ERROR:</strong> ${errorMessage}</p>`;
            document.getElementById('result-container').style.display = 'block';
        };
    </script>
</body>
</html>
