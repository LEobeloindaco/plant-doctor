<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Doctor - Analisi Visiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #60ad5e;
            --primary-dark: #005005;
            --bg-color: #f4f9f4;
            --card-bg: #ffffff;
            --text-main: #1a3c20;
            --text-muted: #5c7c61;
            --accent: #d32f2f;
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            padding: 2rem 1rem;
            text-align: center;
            color: white;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.2);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        h1 {
            margin: 0;
            font-weight: 600;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        p.subtitle {
            margin: 0.5rem 0 0 0;
            font-weight: 300;
            opacity: 0.9;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 600px;
            padding: 2rem 1.5rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        label {
            font-weight: 600;
            color: var(--primary-dark);
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            background: transparent;
            color: var(--primary);
            border: 2px dashed var(--primary-light);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload-btn:hover {
            background: rgba(96, 173, 94, 0.1);
            border-color: var(--primary);
        }

        .image-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 1rem;
        }

        img#uploaded-image {
            width: 100%;
            height: auto;
            display: block;
        }

        canvas#overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        button.primary-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
            width: 100%;
            display: none;
        }

        button.primary-btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }
        
        button.primary-btn:active {
            transform: translateY(0);
        }

        #result-container {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        #loading {
            display: none;
            text-align: center;
            color: var(--primary);
            font-weight: 600;
            padding: 1rem;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(46, 125, 50, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .markdown-content h3 {
            color: var(--primary-dark);
            margin-top: 0;
        }
        
        .markdown-content p {
            line-height: 1.6;
        }
        
        .markdown-content strong {
            color: var(--accent);
        }

        .tabs {
            display: flex;
            width: 100%;
            max-width: 600px;
            margin: 1.5rem auto -0.5rem;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 1rem;
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: var(--primary);
            color: white;
        }

        .tab:not(.active):hover {
            background: rgba(96, 173, 94, 0.1);
            color: var(--primary-dark);
        }
    </style>
</head>
<body>

    <header>
        <h1>🌿 Plant Doctor</h1>
        <p class="subtitle">Analisi visiva avanzata con intelligenza artificiale</p>
    </header>

    <div class="tabs">
        <a href="index.html" class="tab">✏️ Analisi Testuale</a>
        <a href="webview.html" class="tab active">📷 Analisi Visiva</a>
    </div>

    <main>
        <!-- User Input Section -->
        <div class="card">
            <div class="input-group">
                <label>Carica la foto della tua pianta:</label>
                
                <label class="file-upload-btn" for="image-upload" id="upload-label">
                    📷 Clicca per caricare o scattare una foto
                </label>
                <input type="file" id="image-upload" accept="image/*" onchange="previewImage(event)">

                <div class="image-container" id="image-container">
                    <img id="uploaded-image" alt="Pianta caricata">
                    <canvas id="overlay"></canvas>
                </div>

                <button class="primary-btn" id="analyze-btn" onclick="requestAnalysis()">Analizza con Gemma Visiva</button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading">
            <div class="spinner"></div>
            <div>Scansione delle aree interessate in corso...</div>
        </div>

        <!-- Result Section -->
        <div id="result-container" class="card">
            <div class="markdown-content" id="result-content">
                <!-- Result will be injected here -->
            </div>
        </div>
    </main>

    <script>
        // Preview the uploaded image
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('uploaded-image');
                    img.src = e.target.result;
                    
                    document.getElementById('image-container').style.display = 'block';
                    document.getElementById('analyze-btn').style.display = 'block';
                    document.getElementById('upload-label').style.display = 'none';
                    
                    // Clear previous results and canvas
                    document.getElementById('result-container').style.display = 'none';
                    const canvas = document.getElementById('overlay');
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
                reader.readAsDataURL(file);
            }
        }

        // Request analysis
        function requestAnalysis() {
            // Show loading
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            // Clear previous drawings
            const canvas = document.getElementById('overlay');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Se c'è un'interfaccia nativa, potremmo chiamarla così:
            if (window.AndroidInterface && window.AndroidInterface.processImagePrompt) {
                window.AndroidInterface.processImagePrompt("Analizza questa pianta e identifica le aree problematiche restituendo coordinate per cerchiarle.");
            } else {
                // Simulazione di una risposta dal modello per il webview
                setTimeout(() => {
                    // Supponiamo che il modello restituisca un JSON o dei dati strutturati 
                    // con le aree da evidenziare e la diagnosi
                    const mockResponse = {
                        text: "Ho analizzato l'immagine. Le aree cerchiate in rosso indicano zone con **clorosi marcata** e possibili segni di **attacco fungino** sulle foglie inferiori.\n\n### Consigli di Cura:\n1. Rimuovi le foglie gravemente danneggiate.\n2. Tratta con un fungicida specifico a base di rame.\n3. Assicurati che ci sia un buon ricircolo d'aria tra le foglie.",
                        areas: [
                            { x: 0.3, y: 0.4, radius: 0.1 },
                            { x: 0.6, y: 0.7, radius: 0.08 }
                        ]
                    };
                    
                    // In a real scenario, ai_edge_gallery_get_result would be called by the native app
                    window.ai_edge_gallery_get_result(JSON.stringify(mockResponse));
                }, 2500);
            }
        }

        // Draw circles on the canvas
        function drawCircles(areas) {
            const canvas = document.getElementById('overlay');
            const img = document.getElementById('uploaded-image');
            
            // Match canvas size to image size exactly
            canvas.width = img.clientWidth;
            canvas.height = img.clientHeight;
            
            const ctx = canvas.getContext('2d');
            
            // Set circle styles
            ctx.strokeStyle = '#d32f2f'; // Red color
            ctx.lineWidth = 4;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 4;
            
            areas.forEach(area => {
                const x = area.x * canvas.width;
                const y = area.y * canvas.height;
                const radius = area.radius * Math.min(canvas.width, canvas.height);
                
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, 2 * Math.PI);
                ctx.stroke();
                
                // Add a subtle fill
                ctx.fillStyle = 'rgba(211, 47, 47, 0.2)';
                ctx.fill();
            });
        }

        // QUESTA È LA FUNZIONE CRITICA esposta per l'app nativa
        window.ai_edge_gallery_get_result = function(resultString) {
            document.getElementById('loading').style.display = 'none';
            
            let resultData;
            let resultText = resultString;
            let areas = [];

            // Try to parse as JSON (in case the model returns structured data with coordinates)
            try {
                resultData = JSON.parse(resultString);
                if (resultData.text) resultText = resultData.text;
                if (resultData.areas) areas = resultData.areas;
            } catch (e) {
                // Not JSON, just normal text
                console.log("Response is not JSON, treating as plain text");
            }

            // Mostra contenitore risultato
            const resultContainer = document.getElementById('result-container');
            const resultContent = document.getElementById('result-content');
            
            // Format base text
            const formattedText = resultText
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/### (.*?)(<br>|<\/p>)/g, '<h3>$1</h3>$2');
            
            resultContent.innerHTML = `<p>${formattedText}</p>`;
            resultContainer.style.display = 'block';

            // Draw the circles if we have areas
            if (areas && areas.length > 0) {
                // Ensure image is fully loaded before drawing
                const img = document.getElementById('uploaded-image');
                if (img.complete) {
                    drawCircles(areas);
                } else {
                    img.onload = () => drawCircles(areas);
                }
            }
        };
        
        // Handle window resize to redraw circles correctly
        window.addEventListener('resize', () => {
            // Se abbiamo già mostrato il risultato e ci sono aree (usando un timeout semplice qui per la demo)
            // L'ideale sarebbe salvare l'ultimo resultData e ridisegnarlo.
            const canvas = document.getElementById('overlay');
            const img = document.getElementById('uploaded-image');
            
            if (canvas.width > 0 && img.clientWidth > 0 && document.getElementById('result-container').style.display === 'block') {
               // Per un'implementazione completa dovremmo memorizzare `areas` globalmente e richiamare drawCircles(areas)
            }
        });

        // Esposizione di una funzione per ricevere eventuali errori dal modello
        window.ai_edge_gallery_on_error = function(errorMessage) {
            document.getElementById('loading').style.display = 'none';
            const resultContent = document.getElementById('result-content');
            resultContent.innerHTML = `<p style="color: red;"><strong>Errore:</strong> ${errorMessage}</p>`;
            document.getElementById('result-container').style.display = 'block';
        };
    </script>
</body>
</html>
