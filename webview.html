<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Doctor Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0B130D;
            --surface: rgba(20, 35, 23, 0.95);
            --surface-border: rgba(74, 222, 128, 0.3);
            --primary: #4ade80;
            --text-main: #ecfdf5;
            --text-muted: #86efac;
            --alert: #ef4444;
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 12px;
            background-color: transparent;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* Top Bar */
        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.8rem;
            color: var(--primary);
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        .badge {
            background: rgba(74, 222, 128, 0.15);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* Markdown Styling */
        .markdown-content {
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .markdown-content h3 {
            color: #fff;
            margin: 1.5rem 0 1rem;
            font-size: 1.1rem;
            border-left: 3px solid var(--primary);
            padding-left: 10px;
        }

        .markdown-content p { margin-bottom: 1rem; }
        .markdown-content strong { color: var(--primary); font-weight: 600; }

        .markdown-content ul, .markdown-content ol {
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .markdown-content li {
            margin-bottom: 0.5rem;
        }
        
        .markdown-content li::marker {
            color: var(--primary);
        }

        blockquote {
            border-left: 3px solid var(--primary);
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-style: italic;
            background: rgba(74, 222, 128, 0.05);
            padding: 15px;
            border-radius: 0 12px 12px 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="widget-header">
            <div class="status-indicator">
                <div class="status-dot"></div>
                SYS.BOTANY_ACTIVE
            </div>
            <div class="badge">DIAGNOSI</div>
        </div>

        <div id="result-content" class="markdown-content">
            <p>Elaborazione dati botanici in corso...</p>
        </div>
    </div>

    <script>
        function formatMarkdown(text) {
            if (!text) return "Nessun dato ricevuto.";
            
            let html = text
                .replace(/\n\n/g, '</p><p>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/### (.*?)(<br>|\n|<\/p>)/g, '<h3>$1</h3>$2')
                .replace(/> (.*?)(<br>|\n|<\/p>)/g, '<blockquote>$1</blockquote>$2');

            html = html.replace(/(\d+\.) (.*?)(<br>|\n|<\/p>)/g, '<li style="list-style-type: decimal; margin-left: 1.5rem;"><strong>$1</strong> $2</li>$3');
            html = html.replace(/(\*) (.*?)(<br>|\n|<\/p>)/g, '<li style="list-style-type: disc; margin-left: 1.5rem;">$2</li>$3');
            
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return { res: params.get('res') };
        }

        window.onload = () => {
            const params = getUrlParams();
            let rawText = params.res ? decodeURIComponent(params.res) : null;
            
            if (rawText && rawText.includes("window.AndroidInterface.processPrompt")) {
                rawText = "Errore di parsing nell'app: Ricevuto comando JS invece della risposta.";
            }

            if (rawText) {
                // Parse potential JSON from vision model
                try {
                    let data = JSON.parse(rawText);
                    if (data.text) {
                        rawText = data.text;
                    }
                } catch(e) {
                    // Not JSON, just use as text
                }
                
                document.getElementById('result-content').innerHTML = `<p>${formatMarkdown(rawText)}</p>`;
            }
        };
    </script>
</body>
</html>
